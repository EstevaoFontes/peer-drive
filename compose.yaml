services:
    postgres:
      image: postgres:17
      container_name: peer-drive-db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: